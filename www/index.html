<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>مَيّة</title>
<style>
:root{--bg:#06202b;--aqua:#3de0e6;--foam:#9ff5d1;--deep:#0b4a63;--ink:#e9fbff;--mute:#8fb9c6;--glass:rgba(255,255,255,.09);--edge:rgba(255,255,255,.22)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;min-height:100%;background:var(--bg);color:var(--ink);font-family:'Segoe UI',Tahoma,system-ui,sans-serif}
body{padding:calc(env(safe-area-inset-top,0px) + 18px) 16px calc(env(safe-area-inset-bottom,0px) + 28px);overflow-x:hidden}
.blob{position:fixed;border-radius:50%;filter:blur(60px);opacity:.55;z-index:0;animation:drift 14s ease-in-out infinite alternate}
.b1{width:260px;height:260px;background:#12b5c9;top:-60px;right:-80px}
.b2{width:240px;height:240px;background:#2a7fd4;bottom:80px;left:-90px;animation-delay:-5s}
.b3{width:180px;height:180px;background:#35d9a0;top:45%;right:-60px;animation-delay:-9s;opacity:.35}
@keyframes drift{to{transform:translate(30px,-40px) scale(1.15)}}
main{position:relative;z-index:1;max-width:480px;margin:auto;display:grid;gap:14px}
.glass{background:var(--glass);border:1px solid var(--edge);border-radius:26px;backdrop-filter:blur(22px) saturate(160%);-webkit-backdrop-filter:blur(22px) saturate(160%);box-shadow:0 12px 40px rgba(0,0,0,.28),inset 0 1px 0 rgba(255,255,255,.3);padding:18px}
h1{margin:0;font-size:26px;font-weight:800}
.sub{color:var(--mute);font-size:14px;margin-top:2px}
.hero{display:grid;justify-items:center;gap:14px;padding:22px 18px}
.orb{position:relative;width:230px;height:230px;border-radius:50%;overflow:hidden;border:2px solid var(--edge);background:rgba(0,0,0,.25);box-shadow:inset 0 0 40px rgba(61,224,230,.25),0 0 50px rgba(61,224,230,.25)}
.wave{position:absolute;left:-50%;width:200%;height:200%;border-radius:41%;animation:spin 9s linear infinite;transition:top 1.2s cubic-bezier(.2,.8,.2,1)}
.w1{background:rgba(61,224,230,.55)}
.w2{background:rgba(159,245,209,.4);animation-duration:13s;animation-direction:reverse}
@keyframes spin{to{transform:rotate(360deg)}}
.orb .txt{position:absolute;inset:0;display:grid;place-content:center;text-align:center;text-shadow:0 2px 12px rgba(0,0,0,.45)}
.orb b{font-size:44px;line-height:1}.orb span{font-size:14px;color:#dff}
.row{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
.stat{flex:1;min-width:100px;text-align:center;padding:12px 8px;border-radius:18px;background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.12)}
.stat b{display:block;font-size:20px}.stat span{font-size:12px;color:var(--mute)}
.btns{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
button{font:inherit;color:var(--ink);cursor:pointer}
.add{padding:14px 4px;border-radius:20px;border:1px solid var(--edge);background:linear-gradient(160deg,rgba(61,224,230,.3),rgba(255,255,255,.06));font-weight:700;font-size:15px;transition:transform .15s}
.add:active{transform:scale(.92)}.add small{display:block;font-weight:400;color:var(--mute);font-size:11px}
.pill{padding:10px 16px;border-radius:14px;border:1px solid var(--edge);background:rgba(255,255,255,.1);font-size:14px}
.pill.main{background:linear-gradient(135deg,#1fc8d4,#2a8fd4);border:0;font-weight:700}
h2{margin:0 0 10px;font-size:17px}
.next{display:flex;align-items:center;gap:12px}.next .ico{font-size:30px;animation:bob 2.4s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-5px)}}
input{width:100%;padding:12px;border-radius:14px;border:1px solid var(--edge);background:rgba(0,0,0,.25);color:var(--ink);font:inherit;text-align:center}
.f{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:10px}.f label{font-size:12px;color:var(--mute);display:block;margin-bottom:4px}
ul{list-style:none;margin:0;padding:0;display:grid;gap:8px;max-height:220px;overflow:auto}
li{display:flex;justify-content:space-between;padding:10px 14px;border-radius:14px;background:rgba(255,255,255,.07);font-size:14px}
.empty{color:var(--mute);font-size:14px;text-align:center;padding:8px}
#toast{position:fixed;bottom:28px;left:50%;transform:translate(-50%,120px);z-index:5;padding:12px 20px;border-radius:16px;background:rgba(10,60,80,.85);border:1px solid var(--edge);backdrop-filter:blur(14px);transition:transform .35s;font-size:14px}
#toast.on{transform:translate(-50%,0)}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
</head>
<body>
<div class="blob b1"></div><div class="blob b2"></div><div class="blob b3"></div>
<main>
  <div><h1>مَيّة 💧</h1><div class="sub" id="date"></div></div>

  <section class="glass hero">
    <div class="orb">
      <div class="wave w1" id="w1"></div><div class="wave w2" id="w2"></div>
      <div class="txt"><b id="cur">0</b><span>من <span id="goalTxt"></span> مل</span></div>
    </div>
    <div class="row" style="width:100%">
      <div class="stat"><b id="left">0</b><span>متبقي (مل)</span></div>
      <div class="stat"><b id="per">0</b><span>كل تذكير (مل)</span></div>
      <div class="stat"><b id="pct">0٪</b><span>الإنجاز</span></div>
    </div>
  </section>

  <section class="glass">
    <h2>سجّل اللي شربته</h2>
    <div class="btns">
      <button class="add" data-ml="100">100<small>مل</small></button>
      <button class="add" data-ml="200">200<small>مل</small></button>
      <button class="add" data-ml="250">كوباية<small>250</small></button>
      <button class="add" data-ml="500">زجاجة<small>500</small></button>
    </div>
  </section>

  <section class="glass next">
    <div class="ico">⏰</div>
    <div><div class="sub">التذكير الجاي</div><b id="nextT" style="font-size:20px"></b><div class="sub">كل نص ساعة من 8 الصبح لـ 10 بالليل</div></div>
  </section>

  <section class="glass">
    <h2>هدفك اليومي</h2>
    <div class="f">
      <div><label>وزنك (كجم)</label><input id="kg" type="number" inputmode="numeric" placeholder="مثلاً 75"></div>
      <div><label>الهدف (مل)</label><input id="goal" type="number" inputmode="numeric"></div>
    </div>
    <div class="row">
      <button class="pill" id="calc">احسب من وزني</button>
      <button class="pill main" id="save">حفظ وتفعيل التذكير</button>
    </div>
    <div class="sub" style="margin-top:10px">الحساب التقريبي 40 مل لكل كجم. التزم بالكمية اللي الدكتور حددها لك.</div>
  </section>

  <section class="glass">
    <h2>سجل النهارده</h2>
    <ul id="log"></ul>
    <div class="row" style="margin-top:10px"><button class="pill" id="undo">تراجع عن آخر مرة</button></div>
  </section>
</main>
<div id="toast"></div>
<script>
const $=id=>document.getElementById(id);
const LN=window.Capacitor&&window.Capacitor.Plugins&&window.Capacitor.Plugins.LocalNotifications;
const today=()=>new Date().toISOString().slice(0,10);
const ar=n=>String(n).replace(/\d/g,d=>'٠١٢٣٤٥٦٧٨٩'[d]);
let S;
try{S=JSON.parse(localStorage.getItem('water'))}catch(e){}
if(!S)S={goal:3000,kg:'',day:today(),log:[]};
if(S.day!==today()){S.day=today();S.log=[]}
const save=()=>{try{localStorage.setItem('water',JSON.stringify(S))}catch(e){}};
const SLOTS=[];for(let m=480;m<=1320;m+=30)SLOTS.push(m);
const per=()=>Math.max(50,Math.round(S.goal/SLOTS.length/10)*10);
const fmt=m=>{const h=Math.floor(m/60),mm=m%60,p=h>=12?'م':'ص',h12=h%12||12;return ar(h12)+':'+ar(String(mm).padStart(2,'0'))+' '+p};
function toast(t){const e=$('toast');e.textContent=t;e.classList.add('on');setTimeout(()=>e.classList.remove('on'),2600)}
function render(){
  const cur=S.log.reduce((a,x)=>a+x.ml,0),pct=Math.min(100,Math.round(cur/S.goal*100));
  $('cur').textContent=ar(cur);$('goalTxt').textContent=ar(S.goal);
  $('left').textContent=ar(Math.max(0,S.goal-cur));$('per').textContent=ar(per());$('pct').textContent=ar(pct)+'٪';
  const top=100-pct*0.9;$('w1').style.top=top+'%';$('w2').style.top=(top+2)+'%';
  $('goal').value=S.goal;$('kg').value=S.kg;
  $('date').textContent=new Date().toLocaleDateString('ar-EG',{weekday:'long',day:'numeric',month:'long'});
  const now=new Date(),nm=now.getHours()*60+now.getMinutes(),nx=SLOTS.find(s=>s>nm);
  $('nextT').textContent=nx?fmt(nx):'بكره الساعة '+fmt(480);
  $('log').innerHTML=S.log.length?S.log.slice().reverse().map(x=>`<li><span>💧 ${ar(x.ml)} مل</span><span>${x.t}</span></li>`).join(''):'<div class="empty">لسه مشربتش النهارده. ابدأ بكوباية.</div>';
}
document.querySelectorAll('.add').forEach(b=>b.onclick=()=>{
  const d=new Date();S.log.push({ml:+b.dataset.ml,t:fmt(d.getHours()*60+d.getMinutes())});save();render();
  const cur=S.log.reduce((a,x)=>a+x.ml,0);toast(cur>=S.goal?'🎉 وصلت لهدف النهارده!':'تمام، كمّل 👏');
});
$('undo').onclick=()=>{S.log.pop();save();render()};
$('calc').onclick=()=>{const k=+$('kg').value;if(!k){toast('اكتب وزنك الأول');return}$('goal').value=Math.round(k*40/50)*50};
$('save').onclick=async()=>{
  const g=+$('goal').value;if(g<500){toast('الهدف قليل أوي');return}
  S.goal=g;S.kg=$('kg').value;save();render();
  if(await schedule())toast('تم. التذكيرات اشتغلت كل نص ساعة ✅');
};
async function schedule(){
  if(!LN){toast('التذكيرات بتشتغل جوه التطبيق على الموبايل بس');return false}
  try{
    const p=await LN.requestPermissions();
    if(p.display!=='granted'){toast('فعّل الإشعارات للتطبيق من إعدادات الموبايل');return false}
    try{const e=await LN.checkExactNotificationSetting();if(e.exact_alarm==='denied')await LN.changeExactNotificationSetting()}catch(e){}
    const pend=await LN.getPending();if(pend.notifications.length)await LN.cancel(pend);
    await LN.schedule({notifications:SLOTS.map((m,i)=>({id:i+1,title:'💧 وقت الماية',body:'اشرب حوالي '+per()+' مل دلوقتي',channelId:'water_ring',schedule:{on:{hour:Math.floor(m/60),minute:m%60},allowWhileIdle:true}}))});
    return true;
  }catch(e){toast('حصلت مشكلة في التذكيرات');return false}
}
save();render();setInterval(render,60000);
if(LN&&!localStorage.getItem('sched2')){schedule().then(ok=>{if(ok)localStorage.setItem('sched2','1')})}
</script>
</body>
</html>
